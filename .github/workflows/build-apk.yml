
name: Build 89 Fitness Yoga Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Find an existing Android project
          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            ! -path "./.git/*" \
            ! -path "./extracted-source/*" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "Found Android project directly in repository"
          else
            # Find source ZIP anywhere in repository
            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android source ZIP found in repository"
              exit 1
            fi

            echo "Found source archive: $ZIP_FILE"

            mkdir -p extracted-source
            unzip -q "$ZIP_FILE" -d extracted-source

            # Find Kotlin DSL or Groovy settings file
            SETTINGS_FILE=$(find extracted-source \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: No settings.gradle.kts or settings.gradle found inside ZIP"
              echo "Extracted files:"
              find extracted-source -maxdepth 4 -type f | head -100
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "Found Android project inside ZIP"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.p12

          test -s my-upload-key.p12
          echo "Keystore restored successfully"

      - name: Show release certificate fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          keytool -list -v \
            -keystore my-upload-key.p12 \
            -storetype PKCS12 \
            -alias upload \
            -storepass "$STORE_PASSWORD"

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Verify Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          if ! find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | grep -q .; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

      - name: Remove temporary keystore
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f my-upload-key.p12

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
