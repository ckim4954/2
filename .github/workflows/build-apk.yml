
name: Build 89 Fitness Yoga Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Get source code
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Find and extract the actual source ZIP
      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Check whether Android source is already extracted
          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            # Find ZIP in repository root, not inside .github
            ZIP_FILE=$(find . -maxdepth 2 \
              -type f -iname "*.zip" \
              ! -path "./.git/*" \
              ! -path "./.github/*" \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Source ZIP not found in repository root"
              exit 1
            fi

            echo "Using source archive: $ZIP_FILE"

            mkdir -p extracted-source
            unzip -q "$ZIP_FILE" -d extracted-source

            SETTINGS_FILE=$(find extracted-source \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Gradle settings file not found in ZIP"
              find extracted-source -maxdepth 4 -type f | head -100
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Gradle wrapper properties not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      # 3. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install the exact Gradle version required by the source
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Verify Android SDK already available on runner
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK location: $ANDROID_HOME"
          echo "SDK Manager version:"
          "$SDKMANAGER" --version

      # 6. Install required SDK packages
      - name: Install Android SDK 36.1
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "Android SDK installation completed"

      # 7. Restore signing keystore
      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.p12

          if [ ! -s my-upload-key.p12 ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Release keystore restored successfully"

      # 8. Print SHA-1 and SHA-256
      - name: Show release certificate fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          keytool -list -v \
            -keystore my-upload-key.p12 \
            -storetype PKCS12 \
            -alias upload \
            -storepass "$STORE_PASSWORD"

      # 9. Build signed Release APK
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Gradle version:"
          gradle --version

          echo "Building 89 FITNESS & YOGA Release APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 10. Verify APK output
      - name: Verify Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release output directory not found"
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

          if ! find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          echo "Release APK generated successfully"

      # 11. Remove temporary keystore
      - name: Remove temporary keystore
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f my-upload-key.p12

      # 12. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
