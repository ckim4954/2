
name: Build 89 Fitness Yoga Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' | head -n 1)"
            if [ -z "$ZIP_FILE" ]; then
              echo "Android source ZIP not found"
              exit 1
            fi
            mkdir -p extracted-source
            unzip -q "$ZIP_FILE" -d extracted-source
            SETTINGS_FILE="$(find extracted-source -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "settings.gradle.kts not found"
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.p12
          test -s my-upload-key.p12

      - name: Show release certificate fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore my-upload-key.p12 \
            -storetype PKCS12 \
            -alias upload \
            -storepass "$STORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/my-upload-key.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
