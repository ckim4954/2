
name: Build 89 Fitness Yoga Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download source
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Locate Android project
      - name: Find Android project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$(pwd)"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android source ZIP not found"
              exit 1
            fi

            mkdir -p extracted-source
            unzip -q "$ZIP_FILE" -d extracted-source

            SETTINGS_FILE="$(find extracted-source -type f -name settings.gradle.kts -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts not found"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      # 3. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Use preinstalled Android SDK
      - name: Verify Android SDK tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found on runner"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "SDK Manager version:"
          "$SDKMANAGER" --version

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # 5. Install only required SDK packages
      - name: Install required Android SDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "Android SDK installation completed"

      # 6. Restore signing keystore
      - name: Restore release keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.p12

          if [ ! -s my-upload-key.p12 ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore restored successfully"

      # 7. Extract SHA-1 and SHA-256
      - name: Show release certificate fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          echo "Reading release certificate..."

          keytool -list -v \
            -keystore my-upload-key.p12 \
            -storetype PKCS12 \
            -alias upload \
            -storepass "$STORE_PASSWORD"

      # 8. Build signed APK
      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.p12
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 9. Verify APK
      - name: Verify Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs/apk -type f || true
            exit 1
          fi

          ls -lh "$APK"

      # 10. Remove temporary keystore
      - name: Remove temporary keystore
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f my-upload-key.p12

      # 11. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 89-fitness-yoga-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
